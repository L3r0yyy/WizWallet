<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WizWallet - Secure Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>
    <div class="auth-body">
        <div class="auth-container">
            <div class="login-header">
                <h1>WizWallet</h1>
                <p>Secure Access Portal</p>
            </div>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your ID" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Access Dashboard</button>
            </form>
            {% if error %}
            <p class="text-danger" style="margin-top: 15px;">{{ error }}</p>
            {% endif %}
            <a href="/register" style="margin-top: 15px; display: inline-block;">Don't have an account? Sign Up</a>
        </div>
    </div>
</body>

</html>
